<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九条 真尋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="誰のスマホだろう？">
<meta name="theme-color" content="#f4f4ee">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* 단일 화이트 룩. 아이폰 라이트 모드 문법, 아이콘과 그래픽은 직접 그림. 테마컬러 노랑·초록 */
:root{
  color-scheme: light;
  --stage:#ecece4;
  --bg:#f2f2f7;
  --cell:#ffffff;
  --cell2:#e5e5ea;
  --fill:#e3e3e8;
  --sep:#d1d1d6;
  --text:#000;
  --sec:#8a8a8e;
  --ter:#b0b0b5;
  --tint:#007aff;
  --green:#34c759;
  --red:#ff3b30;
  --amber:#f2b81f;
  --olive:#4f6b22;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
  --font-ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;-webkit-font-smoothing:antialiased}
body.ko{font-family:var(--font-ko)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.foot{font-size:11.5px;color:#8a8a80;text-align:center;flex:none}

.phone{position:relative;width:min(390px,100%);height:min(844px,calc(100% - 26px));min-height:560px;border-radius:48px;background:var(--bg);
  box-shadow:0 0 0 10px #f9f9f6,0 0 0 11px #cfcfc6,0 30px 70px rgba(80,80,40,.22);overflow:hidden;flex:none;isolation:isolate;color:var(--text)}
@media (max-width:440px){.phone{border-radius:34px;box-shadow:0 0 0 5px #f9f9f6,0 0 0 6px #cfcfc6}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:50;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:40;font-variant-numeric:tabular-nums;color:#000}
.status .r{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12.5px;border:1.2px solid rgba(0,0,0,.4);border-radius:4px;padding:1.5px;position:relative;display:inline-block}
.bat i{display:block;height:100%;width:41%;background:#000;border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;background:rgba(0,0,0,.4);border-radius:0 1px 1px 0}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#000;z-index:45}
.homebar-hit{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:46}

/* 배경화면: 아침 햇빛 같은 노랑과 연두 */
.wall{background:
  radial-gradient(70% 45% at 82% 10%,rgba(255,214,90,.85),transparent 65%),
  radial-gradient(80% 55% at 5% 92%,rgba(140,178,74,.75),transparent 66%),
  radial-gradient(55% 40% at 35% 55%,rgba(255,244,196,.9),transparent 70%),
  radial-gradient(45% 30% at 95% 70%,rgba(200,222,140,.7),transparent 70%),
  linear-gradient(170deg,#fff9e2 0%,#f4f6dc 55%,#e2edc7 100%)}

/* 잠금 */
.lock-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 14px 54px;width:100%;color:#1e2410}
.lock-date{font-size:19px;font-weight:600;color:rgba(30,36,16,.78);margin-top:8px}
.lock-time{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;color:#2c3812;margin-top:2px;font-variant-numeric:tabular-nums;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Sans",system-ui,sans-serif}
.notif{margin-top:auto;width:100%;background:rgba(255,255,255,.62);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:1px 10px;align-items:center;text-align:left;color:#000;box-shadow:0 4px 18px rgba(80,90,30,.08)}
.notif .aic{grid-row:span 2;width:38px;height:38px;border-radius:9px;overflow:hidden}
.notif .aic svg{width:100%;height:100%;display:block}
.notif b{font-size:15px;font-weight:600}
.notif small{color:rgba(0,0,0,.45);font-size:13px}
.notif p{grid-column:2/4;margin:0;font-size:15px;line-height:1.3}
.lock-row{display:flex;justify-content:space-between;width:100%;padding:18px 34px 0}
.lock-row span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);display:grid;place-items:center}
.lock-hint{font-size:13px;color:rgba(30,36,16,.55);margin-top:14px}

/* 암호 */
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px 50px;background:rgba(255,255,255,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);width:100%;color:#1e2410}
.pin-title{font-size:20px;margin-top:22px}
.dots{display:flex;gap:22px;margin:20px 0 34px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #1e2410}
.dots i.on{background:#1e2410}
.dots.shake{animation:shake .45s}
@keyframes shake{15%,55%{transform:translateX(-10px)}35%,75%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center;color:#1e2410}
.key b{font-size:34px;font-weight:400}
.key small{font-size:10px;letter-spacing:.18em;margin-top:2px;font-weight:600}
.key:active{background:rgba(255,255,255,.95)}
.pin-foot{display:flex;justify-content:space-between;width:100%;max-width:290px;margin-top:auto;font-size:16px}
.pin-hint{min-height:40px;margin-top:16px;font-size:14px;color:rgba(30,36,16,.7);text-align:center}

/* 홈 */
.home-body{flex:1;display:flex;flex-direction:column;padding:10px 18px 24px;min-height:0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.wdg{border-radius:22px;padding:14px 15px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 4px 16px rgba(80,90,30,.10)}
.wdg.wx{background:linear-gradient(180deg,#1f3f74,#3d6aa8);color:#fff}
.wdg.wx .t{font-size:42px;font-weight:300;line-height:1}
.wdg.wx small{font-size:12px;font-weight:600;display:block}
.wdg.cal{background:#fff;color:#000}
.wdg.cal .dw{color:#ff3b30;font-size:12px;font-weight:700;letter-spacing:.02em}
.wdg.cal .dn{font-size:40px;font-weight:300;line-height:1}
.wdg.cal .ev{border-left:3px solid var(--olive);padding-left:6px;font-size:12px;line-height:1.3}
.wdg.cal .ev small{color:#8e8e93;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;width:76px;text-align:center;color:#2a3216}
.app .ic{width:62px;height:62px;border-radius:14px;overflow:hidden;display:block;box-shadow:0 1px 4px rgba(60,70,20,.18)}
.app .ic svg{width:100%;height:100%;display:block}
.app span.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;font-weight:500}
.app:active .ic{filter:brightness(.85)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.icw{position:relative}
.pager{display:flex;gap:7px;justify-content:center;margin:auto 0 12px;padding:6px 10px;background:rgba(255,255,255,.45);border-radius:12px;align-self:center}
.pager i{width:7px;height:7px;border-radius:50%;background:rgba(40,50,20,.25)}
.pager i.on{background:#2a3216}
.dock{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;background:rgba(255,255,255,.5);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:32px;padding:14px 6px}
.dock .lb{display:none}

@media (max-height:760px){.widgets{display:none}}
.callv{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 24px 50px;background:linear-gradient(180deg,#4a5236,#1e2216);color:#fff}
.cst{color:rgba(255,255,255,.7);font-size:16px;text-align:center;min-height:22px}
.cnm{font-size:34px;font-weight:500;margin-top:8px;text-align:center}
.cnum{color:rgba(255,255,255,.6);font-size:15px;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;margin-top:auto;font-size:12px;text-align:center}
.cgrid span{display:flex;flex-direction:column;align-items:center;gap:7px}
.cgrid i{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16)}
.cend{width:74px;height:74px;border-radius:50%;background:#ff3b30;display:grid;place-items:center;margin-top:40px}
/* 앱 공통 */
.app-screen{background:var(--bg)}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.nav{flex:none;display:flex;align-items:center;min-height:44px;padding:0 8px;position:relative}
.nav .bk{color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px 6px;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .bk svg{flex:none}
.nav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.nav .rt{margin-left:auto;color:var(--tint);font-size:17px;padding:8px}
.large{font-size:34px;font-weight:700;margin:0;padding:2px 18px 10px;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.search{margin:0 16px 12px;background:var(--fill);border-radius:10px;padding:8px 10px;color:var(--sec);font-size:16px;display:flex;gap:6px;align-items:center}
.group{margin:0 16px 22px;background:var(--cell);border-radius:11px;overflow:hidden}
.gtitle{font-size:13px;color:var(--sec);padding:0 32px 6px;text-transform:uppercase}
.cell{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:44px;position:relative;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ind+.cell.ind::before,.cell.ind+.cell::before{left:58px}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--sec);font-size:16px}
.chev{color:var(--ter);flex:none}
.sic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.sic svg{width:19px;height:19px}
.toggle{width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.check{color:var(--tint);font-weight:600}
.empty{color:var(--sec);text-align:center;padding:40px 20px;font-size:15px}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(255,255,255,.97);color:#000;padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:84%;text-align:center;pointer-events:none;transition:opacity .25s;box-shadow:0 8px 30px rgba(0,0,0,.15)}

/* 메시지 */
.trow{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 16px;text-align:left}
.trow .tx{flex:1;min-width:0;padding:11px 16px 11px 0;border-bottom:.5px solid var(--sep)}
.trow .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trow .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm{color:var(--sec);font-size:14px;flex:none;display:flex;align-items:center;gap:4px}
.trow .pv{color:var(--sec);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(180deg,#b6b6bb,#8f8f94)}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:90px;height:90px;font-size:36px}
.av svg{width:60%;height:60%}
.pinned{display:flex;justify-content:center;gap:24px;padding:4px 16px 14px;border-bottom:.5px solid var(--sep)}
.pinned button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.pinned .av{width:72px;height:72px;font-size:28px}
.chat-head{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text);padding:0 0 8px;border-bottom:.5px solid var(--sep);background:rgba(249,249,249,.9)}
.chat{padding:8px 14px 18px;display:flex;flex-direction:column}
.cday{align-self:center;font-size:11.5px;color:var(--sec);margin:16px 0 6px;font-weight:500;text-align:center}
.cday b{font-weight:600}
.bub{max-width:76%;padding:7px 12px;border-radius:18px;font-size:16px;line-height:1.35;background:#fff;color:#000;align-self:flex-start;margin-top:2px;word-break:break-word;position:relative}
.bub.me{background:var(--tint);color:#fff;align-self:flex-end}
.bub.gap{margin-top:8px}
.bub.link,.bub.loc{padding:0;overflow:hidden;width:240px}
.bub .lk-img{height:110px;display:grid;place-items:center}
.bub .lk-tx{padding:8px 12px;background:#fff;color:#000}
.bub .lk-tx small{display:block;color:var(--sec);font-size:12px}
.bub .map-img{height:120px;display:block;width:100%}
.read{align-self:flex-end;font-size:11px;color:var(--sec);margin:3px 4px 0}
.compose{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 30px;background:var(--bg)}
.compose .plus{width:34px;height:34px;border-radius:50%;background:var(--cell2);display:grid;place-items:center;color:var(--sec);font-size:22px;flex:none}
.compose .in{flex:1;border:1px solid var(--sep);border-radius:18px;padding:7px 14px;color:var(--ter);font-size:16px;background:#fff}

/* 전화 */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 0 28px;border-top:.5px solid var(--sep);background:rgba(249,249,249,.94)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sec)}
.tabs button.on{color:var(--tint)}
.tabs svg{width:26px;height:26px}
.seg{display:flex;margin:0 16px 10px;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500;text-align:center;color:#000}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 0 16px;text-align:left}
.crow .tx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 0;border-bottom:.5px solid var(--sep)}
.crow .nm{font-size:17px;font-weight:600}
.crow .nm.miss{color:var(--red)}
.crow .kd{font-size:14px;color:var(--sec)}
.crow .tm{margin-left:auto;color:var(--sec);font-size:15px;white-space:nowrap}
.crow .ii{color:var(--tint)}
.idx{font-size:15px;font-weight:600;color:var(--sec);padding:10px 16px 4px;border-bottom:.5px solid var(--sep);margin-left:0}
.lrow{display:block;width:100%;text-align:left;padding:10px 16px;border-bottom:.5px solid var(--sep);font-size:17px}
.lrow small{color:var(--sec);font-size:13px;margin-left:8px}
.me-card{display:flex;align-items:center;gap:14px;padding:6px 16px 14px;border-bottom:.5px solid var(--sep)}
.me-card b{font-size:20px;display:block}
.me-card small{color:var(--sec)}
.chead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px 18px}
.chead h2{margin:4px 0 0;font-size:28px;font-weight:600}
.chead small{color:var(--sec);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 18px}
.acts button{background:var(--cell);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tint);font-size:11px}
.acts svg{width:22px;height:22px}
.fld{padding:10px 16px}
.fld small{display:block;font-size:14px;color:var(--text)}
.fld span{color:var(--tint);font-size:17px;font-variant-numeric:tabular-nums}
.fld span.plain{color:var(--text)}

/* 캘린더 */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px}
.cal-head h2{font-size:28px;margin:0;font-weight:700}
.cal-head h2 span{color:var(--red)}
.cal-head .arr{display:flex;gap:4px}
.cal-head .arr button{color:var(--red);width:36px;height:36px;display:grid;place-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--sec);text-align:center;padding:4px 8px;border-bottom:.5px solid var(--sep)}
.mon{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 8px}
.mon button{display:flex;flex-direction:column;align-items:center;height:52px;padding-top:6px;border-top:.5px solid #e5e5ea;gap:4px}
.mon .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.mon .sun{color:var(--sec)}
.mon .today .n{background:var(--red);color:#fff;font-weight:600}
.mon .sel .n{background:#000;color:#fff;font-weight:600}
.mon .today.sel .n{background:var(--red);color:#fff}
.mon .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.mon .dot.on{background:#a0a0a5}
.evlist{border-top:.5px solid var(--sep);padding:6px 0}
.ev{display:flex;gap:12px;padding:10px 16px;align-items:stretch}
.ev .tm{width:56px;color:var(--sec);font-size:14px;text-align:right}
.ev .bar{width:4px;border-radius:2px;background:var(--olive)}
.ev .tt{font-size:16px}

/* 메모 */
.nrow{display:block;width:100%;text-align:left;padding:10px 16px;position:relative}
.nrow+.nrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.nrow b{font-size:17px;font-weight:600;display:flex;gap:6px;align-items:center}
.nrow small{color:var(--sec);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nrow small em{font-style:normal;color:#6e6e73;margin-right:8px}
.note{padding:4px 20px 30px}
.note .nd{color:var(--sec);font-size:13px;text-align:center;margin-bottom:14px}
.note h2{font-size:26px;margin:0 0 10px;font-weight:700}
.note pre{font:inherit;font-size:17px;line-height:1.6;white-space:pre-wrap;margin:0}
.locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;color:var(--sec)}
.locked b{color:var(--text);font-size:20px}
.locked .btn{color:var(--tint);font-size:17px;margin-top:6px}

/* 브라우저 */
.urlbar{flex:none;margin:8px 12px 30px;background:var(--fill);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;color:#000}
.page{background:#fff;color:#1c1c1e;flex:1;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.pg-hero{padding:28px 20px;text-align:center}
.pg-body{padding:16px 20px 40px;font-size:15px;line-height:1.75}
.pg-body h3{font-size:17px;margin:18px 0 6px}
.pg-tbl{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.pg-tbl td{color:#1c1c1e;font-size:14px;border-bottom:1px solid #e5e5ea;padding:8px 4px;vertical-align:top}
.pg-tbl td:first-child{color:#6e6e73;width:34%}
.fav{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 16px 20px}
.fav button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--sec);text-align:center}
.fav .fi{width:60px;height:60px;border-radius:12px;background:var(--cell);display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff}

/* 동영상 */
.vtop{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-weight:700;font-size:19px}
.vtop .lg{width:30px;height:22px;border-radius:6px;display:grid;place-items:center}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;background:#e9e9ec;border-radius:8px;padding:6px 12px;font-size:14px}
.chips button.on{background:#0f0f0f;color:#fff}
.vcard{display:block;width:100%;text-align:left;margin-bottom:18px}
.thumb{position:relative;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb .big{font-size:62px;font-weight:900;letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,0,0,.25);transform:rotate(-3deg)}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:1px 5px;border-radius:4px;font-weight:600}
.thumb .bar{position:absolute;left:0;bottom:0;height:3px;background:#f00}
.vmeta{display:flex;gap:12px;padding:10px 14px 0}
.vmeta .av{width:36px;height:36px;font-size:14px}
.vmeta b{font-size:15px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta small{color:#6a6a6a;font-size:12.5px;display:block;margin-top:3px}
.vplay{position:relative}
.vplay .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;cursor:pointer}

/* 지도 */
.mapwrap{flex:1;position:relative;min-height:0;background:#eef0e6}
.mapwrap > svg{position:absolute;inset:0;width:100%;height:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-radius:14px 14px 0 0;padding:8px 0 30px;max-height:44%;overflow-y:auto;scrollbar-width:none;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 8px}
.pin{cursor:pointer}

/* 시계 */
.alarm{display:flex;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.alarm .tt{font-size:52px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.alarm .tt small{font-size:22px}
.alarm .lb{font-size:14px;color:var(--text)}
.alarm.off .tt,.alarm.off .lb{color:var(--sec)}

/* 날씨 */
.wx{flex:1;overflow-y:auto;scrollbar-width:none;background:linear-gradient(180deg,#14284a 0%,#24406c 45%,#3a5f92 100%);text-align:center;padding:20px 16px 40px;color:#fff}
.wx h2{font-size:32px;font-weight:400;margin:10px 0 0}
.wx .big{font-size:96px;font-weight:200;line-height:1}
.wx .card{background:rgba(255,255,255,.12);border-radius:16px;padding:12px;margin-top:16px;text-align:left}
.wx .card small{color:rgba(255,255,255,.7);font-size:12px;display:block;padding-bottom:8px;border-bottom:.5px solid rgba(255,255,255,.2);margin-bottom:8px}
.hrs{display:flex;justify-content:space-between;text-align:center;font-size:14px}
.hrs div{display:flex;flex-direction:column;gap:8px;align-items:center}
.days div{display:grid;grid-template-columns:60px 30px 1fr;gap:10px;align-items:center;padding:6px 0;font-size:16px}
.days .rng{height:4px;border-radius:2px;background:linear-gradient(90deg,#5ac8fa,#ffcc00)}

/* 카메라 */
.cam{flex:1;background:#000;display:flex;flex-direction:column;position:relative;color:#fff}
.cam .vf{flex:1;margin:40px 0 0;background:radial-gradient(70% 50% at 50% 50%,#3b3d2c,#0c0c08);position:relative;overflow:hidden}
.cam .vf::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:33.33% 33.33%}
.cam .modes{display:flex;justify-content:center;gap:18px;font-size:13px;padding:12px 0;color:#ddd;letter-spacing:.04em}
.cam .modes b{color:#ffd60a;font-weight:600}
.cam .ctrl{display:flex;align-items:center;justify-content:space-around;padding:6px 20px 40px}
.cam .shot{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.cam .shot i{width:58px;height:58px;border-radius:50%;background:#fff}
.cam .lastp{width:46px;height:46px;border-radius:8px;overflow:hidden;background:#222}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}

/* 음악 */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px 20px}
.mgrid button{text-align:left;font-size:14px}
.mgrid .art{aspect-ratio:1;border-radius:10px;margin-bottom:6px}

/* 메일 */
.mrow{display:block;width:100%;text-align:left;padding:10px 16px 10px 28px;border-bottom:.5px solid var(--sep);position:relative}
.mrow .tp{display:flex;justify-content:space-between;gap:8px}
.mrow b{font-size:16px}
.mrow .tm{color:var(--sec);font-size:14px;flex:none}
.mrow .sj{font-size:15px;margin-top:2px}
.mrow .pv{color:var(--sec);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow.unread::before{content:"";position:absolute;left:10px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--tint)}
.mail{padding:6px 18px 40px}
.mail .from{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:.5px solid var(--sep)}
.mail h2{font-size:21px;margin:14px 0}
.mail pre{font:inherit;font-size:16px;line-height:1.65;white-space:pre-wrap;margin:0}

/* 폰에서 볼 때: 프레임 없이 화면 꽉 채움 */
@media (max-width:500px){
  html,body{height:100%}
  body{padding:0;gap:0;display:block}
  .phone{width:100%;height:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
  .island,.foot{display:none}
  .status{height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
  .homebar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.toggle::after,.flash{transition:none}.dots.shake{animation:none}}

/* 브라우저 웹페이지 */
.wp{background:#fff;color:#1c1c1e;font-size:15px;line-height:1.65;min-height:100%}
.wp-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2}
.wp-logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:17px}
.wp-nav{display:flex;gap:18px;overflow-x:auto;padding:10px 16px;font-size:13px;border-bottom:1px solid #eee;white-space:nowrap;scrollbar-width:none;color:#444}
.wp-nav::-webkit-scrollbar{display:none}
.wp-crumb{font-size:11px;color:#8e8e93;padding:12px 16px 0}
.wp-sec{padding:14px 16px}
.wp-h1{font-size:22px;line-height:1.4;margin:2px 0 8px;font-weight:700}
.wp-h2{font-size:17px;margin:0 0 10px;padding-left:9px;border-left:4px solid;display:flex;align-items:baseline;gap:8px}
.wp-h2 small{font-size:12px;color:#8e8e93;font-weight:400}
.wp-chips{display:flex;gap:6px;flex-wrap:wrap}
.wp-chip{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.05)}
.wp-btn{display:block;text-align:center;padding:11px;border-radius:10px;font-weight:600;color:#fff;font-size:14px}
.wp-ing{list-style:none;margin:0;padding:0;background:#fff;border-radius:12px;padding:2px 14px}
.wp-ing li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed #e5e0d6;font-size:14px}
.wp-ing li:last-child{border-bottom:0}
.wp-ing b{font-weight:500;white-space:nowrap}
.wp-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:14.5px}
.wp-num{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}
.wp-tip{margin-top:14px;background:#fff;border:1.5px dashed;border-radius:12px;padding:10px 14px;font-size:14px}
.wp-rel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp-rel button{font-size:12px;line-height:1.4;text-align:left}
.wp-rel span{display:block;margin-top:4px}
.wp-ft{background:#f4f4f4;color:#8e8e93;font-size:11px;padding:18px 16px 30px;text-align:center;line-height:1.8}
</style>
</head><body>

</div>

 {d:'2024-07-12', t:'01:10', w:['雨','비'], body:[
`姉ちゃんに会いたい`,
`누나 보고 싶다`]},
 {d:'2024-08-02', t:'23:55', w:['晴れ','맑음'], body:[
`先輩が、来年の夏に富士山に行こうって。
来年の話をされたのは久しぶりだった。
来年の自分がどうしてるのか、あまり想像できない。
山小屋で一泊するのがいいらしい。一応調べた。`,
`선배가 내년 여름에 후지산 가자고 했다.
내년 얘기를 들은 건 오랜만이었다.
내년의 내가 어떻게 지내고 있을지 잘 상상이 안 된다.
산장에서 하룻밤 자는 게 좋다고 한다. 일단 찾아는 봤다.`]},
 {d:'2024-08-21', t:'21:00', w:['晴れ','맑음'], body:[
`母さんと父さんのお墓。白い花と、父さんにはビール。
手を合わせても、何を言えばいいか分からなかった。
帰りの電車で、知らない家族がハンバーグの話をしてた。`,
`엄마 아빠 산소. 흰 꽃이랑, 아빠한테는 맥주.
손을 모으고도 무슨 말을 해야 할지 몰랐다.
돌아오는 전철에서 모르는 가족이 함박스테이크 얘기를 하고 있었다.`]},
 {d:'2024-08-30', t:'02:15', w:['晴れ','맑음'], body:[
`今日は三体。大神さんに「よくやった」と言われた。
鬼を祓ってるときだけは、ここにいていい気がする。
ちゃんと全部やり終えたら、姉ちゃんに会いに行ってもいいかな。`,
`오늘은 셋. 오오가미 씨가 "잘했다"고 하셨다.
귀신을 쫓을 때만큼은 여기 있어도 되는 것 같다.
제대로 다 끝내고 나면, 누나 보러 가도 되려나.`]},
 {d:'2024-09-08', t:'02:48', w:['くもり','흐림'], body:[
`駅のホームで鬼の匂いがした気がして振り返った。普通の会社員だった。
最近こういうことが多い。
帰ってから電気もつけずに座ってた。気づいたら二時だった。`,
`역 승강장에서 귀신 냄새가 난 것 같아서 돌아봤다. 그냥 회사원이었다.
요즘 이런 일이 잦다.
집에 와서 불도 안 켜고 앉아 있었다. 정신 차려 보니 두 시였다.`]},
 {d:'2024-09-18', t:'00:50', w:['くもり','흐림'], body:[
`ジム、今週も四回行った。ベンチ45kgになった。
仕事とジムがあれば、一日はちゃんと埋まる。
それ以外の時間に何をすればいいのかは、よく分からない。`,
`헬스장, 이번 주도 네 번 갔다. 벤치 45kg 됐다.
일이랑 운동이 있으면 하루는 그럭저럭 채워진다.
그 밖의 시간에 뭘 해야 할지는 잘 모르겠다.`]},
 {d:'2024-09-27', t:'22:10', w:['晴れ','맑음'], body:[
`熱が下がった。先輩が二日続けて来てくれた。
熱のせいで、言うつもりのなかったことまで言った。
先輩は、それで十分だと言った。
お礼は肉じゃががいいらしい。`,
`열이 내렸다. 선배가 이틀 연달아 와 줬다.
열 때문에 말할 생각 없던 것까지 말해 버렸다.
선배는 그걸로 충분하다고 했다.
답례는 니쿠자가가 좋다고 한다.`]},
 {d:'2024-10-03', t:'03:30', w:['雨','비'], body:[
`日記、一週間ぶり。
書かなかった日に、何もなかったわけじゃない。
書く気が起きなかっただけ。`,
`일기, 일주일 만이다.
안 쓴 날이라고 아무 일도 없었던 건 아니다.
쓸 기운이 없었을 뿐.`]},
 {d:'2024-10-11', t:'23:58', w:['晴れ','맑음'], body:[
`一年。
早かったのか長かったのか、よく分からない。
自転車で都庁の前を通った。ただの広場だった。
姉ちゃんに「一年経ったよ」と送った。
夜、先輩が大神さんのおでんを持ってきてくれた。
帰りぎわに、ちょっとだけ頭をなでられた。`,
`1년.
빨랐던 건지 길었던 건지 잘 모르겠다.
자전거 타고 도청 앞을 지나갔다. 그냥 광장이었다.
누나한테 "벌써 1년이야"라고 보냈다.
밤에 선배가 오오가미 씨 오뎅을 갖다줬다.
가기 전에 머리를 살짝 쓰다듬어 줬다.`]},
 {d:'2024-10-14', t:'23:45', w:['晴れ','맑음'], body:[
`明日は先輩と神戸へ、姉ちゃんに会いに行く。朝、花を受け取ってから。
姉ちゃんの好きな花も色も知らない。知ってるのはブラックコーヒーだけ。
何を話すかはまだ決めてない。話すことがあるのかも分からない。

自転車のブレーキ、直った。
アラームは七時半。たぶんその前に目が覚める。`,
`내일은 선배랑 고베에 누나 보러 간다. 아침에 꽃 찾아서.
누나가 좋아하는 꽃도 색도 모른다. 아는 건 블랙커피뿐.
무슨 얘기를 할지는 아직 안 정했다. 할 얘기가 있기는 한지도 모르겠다.

자전거 브레이크 고쳤다.
알람은 일곱 시 반. 아마 그 전에 눈이 떠질 거다.`]}

  const list = tab === 'history' ? watched.map(i => [videos[i], i]) : videos.map((v,i) => [v,i]).filter(([v,i]) => !vchipSets[vchip] || vchipSets[vchip].includes(i));
  const chips = [['すべて','전체'],['暮らし','생활'],['趣味','취미']];
  view(`<div class="vtop"><span class="lg">${icon('video').replace('<svg','<svg width="30" height="22"')}</span>${L(APPS.video)}</div>
    ${tab==='home'?`<div class="chips">${chips.map((c,i)=>`<button class="${i===vchip?'on':''}" data-chip="${i}">${L(c)}</button>`).join('')}</div>`:`<h1 class="large" style="font-size:24px">${L(['再生履歴','시청 기록'])}</h1>`}

    <div class="tabs" style="grid-template-columns:1fr 1fr"><button class="${tab==='home'?'on':''}" data-vt="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>${L(['ホーム','홈'])}</button><button class="${tab==='history'?'on':''}" data-vt="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>${L(['履歴','기록'])}</button></div>`);

  $('#shot').onclick = () => { const f = $('#flash'); f.style.opacity = .9; setTimeout(() => f.style.opacity = 0, 120); };
  $('#lastp').onclick = () => openApp(photosApp);
}

/* ================= 지갑 ================= */
function walletApp(){
  const cards = wallet.cards.map((c,i)=>`<div style="height:86px;border-radius:14px;background:linear-gradient(135deg,${c.c[0]},${c.c[1]});color:#fff;margin-top:${i?-40:0}px;padding:14px 16px;display:flex;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.18);position:relative"><b style="font-size:15px;font-weight:600">${esc(L(c.n))}</b><span style="font-size:14px;font-variant-numeric:tabular-nums">${esc(c.sub)}</span></div>`).join('');
  let last = '';
  const rows = wallet.tx.map(t => { let h=''; if (t[0]!==last){ h=`<div class="gtitle" style="padding:12px 16px 6px;text-transform:none">${esc(dayLabel(t[0]))}</div>`; last=t[0]; }
    return h+`<div class="cell" style="background:var(--cell)"><span class="sic" style="background:${t[4]==='ic'?'#d9a20f':'#4f6b22'}"><svg viewBox="0 0 20 20" fill="#fff"><rect x="3" y="5" width="14" height="10" rx="2"/></svg></span><span class="grow"><span style="display:block">${esc(L(t[2]))}</span><small style="color:var(--sec);font-size:13px">${t[1]}　${t[4]==='ic'?L(['交通系IC','교통 IC']):L(['クレジット','신용카드'])}</small></span><span style="font-variant-numeric:tabular-nums">${t[3]}</span></div>`; }).join('');
  view(`${nav(null,'','+')}<h1 class="large">${L(['ウォレット','지갑'])}</h1><div class="scroll"><div style="padding:0 16px 10px">${cards}</div><h2 style="font-size:20px;margin:8px 16px 0">${L(['最近の取引','최근 거래'])}</h2>${rows}</div>`);
}

/* ================= 건강 ================= */
function bars(data, max, color, fmt){
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px">${data.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="font-size:10px;color:var(--sec)">${fmt(d[1])}</span><span style="width:100%;border-radius:4px;background:${i===data.length-1?color:color+'88'};height:${Math.max(4,d[1]/max*80)}px"></span><span style="font-size:10px;color:var(--sec)">${d[0]}</span></div>`).join('')}</div>`;
}
function healthApp(){
  const hm = h => `${Math.floor(h)}${L(['時間','시간'])}${Math.round((h%1)*60)}${L(['分','분'])}`;
  const avgS = health.sleep.reduce((a,b)=>a+b[1],0)/health.sleep.length;
  const avgW = Math.round(health.steps.reduce((a,b)=>a+b[1],0)/health.steps.length);
  const card = (title,color,big,sub,chart) => `<div class="group" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;color:${color};font-weight:600;font-size:15px"><span>${title}</span><span style="color:var(--sec);font-weight:400;font-size:13px">${L(['過去7日間','최근 7일'])}</span></div><div style="font-size:28px;font-weight:600;margin-top:6px">${big}</div><small style="color:var(--sec)">${sub}</small>${chart}</div>`;
  view(`${nav(null)}<h1 class="large">${L(['概要','요약'])}</h1><div class="scroll">
    ${card(L(['睡眠','수면']),'#2f9ad6',hm(health.sleep.at(-1)[1]),L(['平均 ','평균 '])+hm(avgS),bars(health.sleep,8,'#2f9ad6',v=>v.toFixed(1)))}
    ${card(L(['歩数','걸음 수']),'#e08a00',`${health.steps.at(-1)[1].toLocaleString()}<small style="font-size:15px;color:var(--sec)"> ${L(['歩','걸음'])}</small>`,L(['平均 ','평균 '])+avgW.toLocaleString()+L(['歩','걸음']),bars(health.steps,13000,'#e08a00',v=>(v/1000).toFixed(1)+'k'))}
    <div class="group" style="padding:14px 16px"><div style="color:#4f6b22;font-weight:600;font-size:15px">${L(['サイクリング','사이클링'])}</div><div style="font-size:28px;font-weight:600;margin-top:6px">9<small style="font-size:15px;color:var(--sec)"> ${L(['分','분'])}</small></div><small style="color:var(--sec)">${L(['今日','오늘'])}</small></div>
    <div class="group" style="padding:14px 16px"><div style="color:#9b4fd1;font-weight:600;font-size:15px">${L(['体重','체중'])}</div><div style="font-size:28px;font-weight:600;margin-top:6px">50.2<small style="font-size:15px;color:var(--sec)"> kg</small></div><small style="color:var(--sec)">${L(['2024年6月20日 健康診断から','2024년 6월 20일 건강검진에서'])}</small></div>
    <div class="group" style="padding:14px 16px"><div style="color:#ff375f;font-weight:600;font-size:15px">${L(['心拍数','심박수'])}</div><div style="font-size:28px;font-weight:600;margin-top:6px">58<small style="font-size:15px;color:var(--sec)"> ${L(['拍/分','회/분'])}</small></div><small style="color:var(--sec)">${L(['安静時 平均','안정 시 평균'])}</small></div>
  </div>`);
}

/* ================= 스크린 타임 ================= */
function screenTime(){
  const total = Math.round(screen.days.reduce((a,b)=>a+b[1],0)/screen.days.length);
  const max = Math.max(...screen.days.map(d=>d[1]));
  view(`${nav(L(APPS.settings), L(['スクリーンタイム','스크린 타임']))}<div class="scroll" style="padding-top:10px">
    <div class="group" style="padding:14px 16px"><small style="color:var(--sec)">${L(['1日の平均','일일 평균'])}</small><div style="font-size:30px;font-weight:600">${total}${L(['分','분'])}</div><small style="color:var(--sec)">${L(['先週より12%増加','지난주보다 12% 증가'])}</small>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:12px">${screen.days.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="width:100%;border-radius:3px;background:#007aff;height:${d[1]/max*70}px"></span><span style="font-size:10px;color:var(--sec)">${WD[lang][i]}</span></div>`).join('')}</div></div>
    <div class="gtitle">${L(['よく使われたもの','가장 많이 사용됨'])}</div>
    <div class="group">${screen.apps.map(a=>`<div class="cell ind"><span class="ic" style="width:30px;height:30px;border-radius:7px;overflow:hidden;display:block;flex:none">${icon(a[0])}</span><span class="grow">${esc(L(APPS[a[0]]))}<span style="display:block;height:4px;border-radius:2px;background:#007aff;margin-top:5px;width:${a[1]/screen.apps[0][1]*100}%"></span></span><span class="val">${a[1]}${L(['分','분'])}</span></div>`).join('')}</div>
    <div class="gtitle">${L(['持ち上げ','기기 집어 든 횟수'])}</div>
    <div class="group"><div class="cell"><span class="grow">${L(['1日の平均','일일 평균'])}</span><span class="val">${L(['34回','34회'])}</span></div><div class="cell"><span class="grow">${L(['持ち上げ後に最初に使用','집어 든 후 처음 사용'])}</span><span class="val">${L(APPS.msg)}</span></div></div>
    <div class="gtitle">${L(['通知','알림'])}</div>
    <div class="group">${screen.notif.map(n=>`<div class="cell"><span class="grow">${esc(n[0])}</span><span class="val">${L(['1日平均 ','일평균 '])}${n[1]}${L(['件','건'])}</span></div>`).join('')}</div>
  </div>`);
}

/* ================= 음악 ================= */
const art = (c, big) => `<div class="art" style="background:linear-gradient(135deg,${c[0]},${c[1]});${big?'box-shadow:0 10px 30px rgba(0,0,0,.15)':''}"></div>`;
function musicApp(){
  view(`${nav(null)}<h1 class="large">${L(['今すぐ聴く','지금 듣기'])}</h1><div class="scroll">
    <h2 style="font-size:22px;padding:0 16px 10px;margin:0">${L(['最近再生した項目','최근 재생한 항목'])}</h2>
    <div class="mgrid">${music.recent.map((p,i)=>`<button data-rc="${i}">${art(p.c)}${esc(L(p.n))}<small style="display:block;color:var(--sec)">${esc(L(p.by))}</small></button>`).join('')}</div>
    <h2 style="font-size:22px;padding:18px 16px 10px;margin:0">${L(['おすすめプレイリスト','추천 플레이리스트'])}</h2>
    <div class="mgrid">${music.recs.map((p,i)=>`<button data-pl="${i}">${art(p.c)}${esc(L(p.n))}<small style="display:block;color:var(--sec)">${L(['ミュージック編集部','음악 편집부'])}</small></button>`).join('')}</div></div>`);
  $$('#view [data-rc]').forEach(b => b.onclick = () => push(() => playlist(music.recent[+b.dataset.rc])));
  $$('#view [data-pl]').forEach(b => b.onclick = () => push(() => playlist({...music.recs[+b.dataset.pl], by:['ミュージック編集部','음악 편집부']})));
}
function playlist(p){
  const btn = (t) => `<button style="flex:1;background:var(--cell);border-radius:10px;padding:12px;color:var(--red);font-weight:600" data-toast='${T(['オフラインのため再生できません','오프라인이라 재생할 수 없습니다'])}'>${t}</button>`;
  view(`${nav(L(['今すぐ聴く','지금 듣기']))}<div class="scroll"><div style="text-align:center;padding:10px 40px 10px"><div style="aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,${p.c[0]},${p.c[1]});box-shadow:0 10px 30px rgba(0,0,0,.15);display:grid;place-items:center">${p.own?`<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>`:''}</div>
    <h2 style="margin:16px 0 4px;font-size:22px">${esc(L(p.n))}</h2><div style="color:var(--red);font-size:16px">${esc(L(p.by))}</div>${p.len?`<div style="color:var(--sec);font-size:13px;margin-top:4px">${esc(L(p.len))}${p.own?L(['・2024年1月作成','· 2024년 1월 생성']):''}</div>`:''}
    <div style="display:flex;gap:12px;margin-top:18px">${btn('▶ '+L(['再生','재생']))}${btn('⤨ '+L(['シャッフル','셔플']))}</div></div>
    ${p.tracks?`<div class="group" style="margin-top:8px">${p.tracks.map((t,i)=>`<div class="cell" data-toast='${T(['オフラインのため再生できません','오프라인이라 재생할 수 없습니다'])}'><span style="width:20px;color:var(--sec);font-size:14px;text-align:center">${i+1}</span><span class="grow"><span style="display:block;font-size:15px">${esc(t[0])}</span><small style="color:var(--sec);font-size:13px">${esc(t[1])}</small></span><small style="color:var(--sec)">${t[2]}</small></div>`).join('')}</div>`:`<div class="empty" style="padding:20px">${L(['登録すると全曲を聴けます','구독하면 전곡을 들을 수 있습니다'])}</div>`}
  </div>`);
}

/* ================= 일기 ================= */
function diaryApp(){
  const list = [...diary].sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t));
  let last = '', rows = '';
  list.forEach(e => {
    const ym = e.d.slice(0,7);
    if (ym !== last){ const [y,m] = ym.split('-').map(Number); rows += `${last?'</div>':''}<div class="gtitle" style="padding:14px 20px 6px;text-transform:none">${lang==='ko'?`${y}년 ${m}월`:`${y}年${m}月`}</div><div class="group">`; last = ym; }
    const i = diary.indexOf(e), first = L(e.body).split('\n')[0];
    const dd = +e.d.slice(8), w = WD[lang][dObj(e.d).getDay()];
    rows += `<button class="nrow" data-dy="${i}" style="display:flex;gap:14px;align-items:center"><span style="flex:none;width:38px;text-align:center"><b style="font-size:22px;display:block;font-weight:600;line-height:1">${dd}</b><small style="font-size:11px;color:var(--sec)">${w}</small></span><span style="min-width:0;flex:1"><small style="margin:0;color:var(--text,#000);font-size:15px">${esc(first)}</small><small style="font-size:12px">${esc(L(e.w))} · ${e.t}</small></span></button>`;
  });
  rows += '</div>';
  view(`${nav(null,'','<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>')}<h1 class="large">${L(APPS.diary)}</h1><div class="scroll">${rows}<div class="empty" style="padding:10px">${L([diary.length+'件の日記','일기 '+diary.length+'개'])}</div></div>`);
  $$('#view [data-dy]').forEach(b => b.onclick = () => push(() => diaryEntry(+b.dataset.dy)));
}
function diaryEntry(i){
  const e = diary[i];
  view(`${nav(L(APPS.diary))}<div class="scroll" style="background:#fbf8f0"><div style="padding:8px 22px 40px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #e6dcc4;padding-bottom:10px;margin-bottom:14px"><b style="font-size:19px">${esc(longDate(e.d))}</b><small style="color:#8a7d5e">${esc(L(e.w))}　${e.t}</small></div>
    <pre style="font:inherit;font-size:16.5px;line-height:30px;white-space:pre-wrap;margin:0;background:repeating-linear-gradient(#fbf8f0 0 29px,#ece3cd 29px 30px);color:#2f2a1e">${esc(L(e.body))}</pre></div></div>`);
}

/* ================= 시작 ================= */
renderStatic();
show('lock');
</script></body></html>
